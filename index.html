<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIP Anagram Party v1.9</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#07111f,#10214a);color:#fff;min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:18px} .card{background:#0f1a30;border:1px solid #ffffff20;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0005}
.hidden{display:none!important} .center{text-align:center} h1{font-size:clamp(38px,6vw,76px);margin:10px 0} h2{font-size:clamp(28px,4vw,44px)}
button,select,input{font:inherit} button{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer} .primary{background:#fbbf24;color:#111827} .secondary{background:#22304f;color:#fff} .ok{background:#22c55e;color:white} .bad{background:#ef4444;color:white} .info{background:#0891b2;color:white}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
.choice{min-height:110px;font-size:20px} .small{color:#cbd5e1;font-size:13px} .badge{display:inline-block;background:#22304f;padding:8px 12px;border-radius:999px;font-weight:800;margin:4px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px} .box{background:#10192d;border-radius:16px;padding:14px} label{display:block;color:#cbd5e1;font-weight:700;margin-bottom:6px} select,input{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff22;background:#0b1325;color:white}
.turn{background:linear-gradient(135deg,#f59e0b,#ec4899);padding:14px;border-radius:16px;font-size:26px;font-weight:900;text-align:center;margin:14px 0}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} .tile{aspect-ratio:1.15/1;background:#2563eb;color:white;font-size:30px} .tile.used{background:#334155;color:#94a3b8}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px} .team{background:#111a2d;border-radius:16px;padding:14px;text-align:center} .team.active{outline:3px solid #fbbf24} .score{font-size:34px;font-weight:900}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0} .letter{width:68px;height:78px;background:white;color:#111827;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
.hint{font-size:18px;color:#cbd5e1} .answer{font-size:clamp(42px,6vw,72px);font-weight:900;margin:18px} .emoji{font-size:clamp(90px,18vw,190px)} .timer{font-size:46px;font-weight:900} .danger{color:#fecaca;background:#7f1d1d;border-radius:14px;padding:6px 14px}
.diff-Easy{background:#14532d} .diff-Medium{background:#78350f} .diff-Hard{background:#7f1d1d}
.editorrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#111a2d;padding:10px;border-radius:12px;margin:8px 0}
@media(max-width:720px){.board{grid-template-columns:repeat(3,1fr)}.scores{grid-template-columns:repeat(2,1fr)}.letter{width:54px;height:62px;font-size:34px}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="card center">
<div style="font-size:70px">🔤🎉</div>
<h1>KIP ANAGRAM PARTY</h1>
<p class="small">v1.9 Stable Edition</p>
<div class="controls">
<button class="primary" onclick="show('settings')">PLAY GAME</button>
<button class="info" onclick="openBank()">QUESTION BANK</button>
</div>
<div id="resumePanel" class="hidden" style="margin-top:18px">
<p>Saved game found.</p><button class="primary" onclick="resumeGame()">RESUME</button>
</div>
</section>

<section id="settings" class="card hidden">
<h2 class="center">Game Settings</h2>
<div class="settings">
<div class="box"><label>Teams</label><select id="teamCount" onchange="renderTeamNames()"><option>2</option><option>3</option><option selected>4</option></select></div>
<div class="box"><label>Timer</label><select id="timerSec"><option value="0">Off</option><option value="10">10 sec</option><option value="15" selected>15 sec</option><option value="20">20 sec</option><option value="30">30 sec</option></select></div>
<div class="box"><label>Difficulty</label><select id="difficulty"><option value="all">All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
<div class="box"><label>Question Order</label><select id="order"><option value="random">Random</option><option value="fixed">Bank Order</option></select></div>
<div class="box"><label>Anagram</label><select id="anagramMode"><option value="random">Random</option><option value="saved">Saved</option></select></div>
<div class="box"><label>Points</label><select id="pointsMode"><option value="random">Random 10–50</option><option value="20">Fixed 20</option><option value="10">Fixed 10</option></select></div>
</div>
<div class="box" style="margin-top:14px"><label>Team Names</label><div id="teamNames" class="grid"></div></div>
<div class="controls"><button class="secondary" onclick="show('home')">Back</button><button class="primary" onclick="saveSettings()">NEXT</button></div>
</section>

<section id="level" class="card hidden"><h2 class="center">Choose Level</h2><div id="levelGrid" class="grid"></div></section>
<section id="topic" class="card hidden"><h2 class="center" id="topicTitle">Choose Topic</h2><div id="topicGrid" class="grid"></div></section>
<section id="count" class="card hidden"><h2 class="center">How Many Questions?</h2><p id="countInfo" class="center small"></p><div id="countGrid" class="grid"></div></section>

<section id="board" class="hidden">
<div class="controls" style="justify-content:space-between"><div><button class="secondary" onclick="goHome()">Home</button> <button class="secondary" onclick="toggleFull()">Fullscreen</button></div><div><span id="levelBadge" class="badge"></span><span id="topicBadge" class="badge"></span></div></div>
<div id="turnBoard" class="turn"></div>
<div class="card"><h2 class="center">CHOOSE A BOX</h2><div id="boardGrid" class="board"></div><p id="progress" class="center small"></p></div>
<div id="scoreGrid" class="scores"></div>
</section>

<section id="question" class="card center hidden">
<div class="controls" style="justify-content:space-between"><button class="secondary" onclick="show('board')">Back</button><span id="qNum" class="badge"></span></div>
<div id="turnQuestion" class="turn"></div>
<span id="diffBadge" class="badge"></span>
<h2>Unscramble the word!</h2>
<div id="timerWrap"><div id="timer" class="timer"></div></div>
<div id="letters" class="letters"></div>
<div id="hint" class="hint"></div>
<div id="answerPanel" class="hidden"><div id="emoji" class="emoji"></div><div id="answer" class="answer"></div></div>
<div id="resultMsg" class="hidden" style="font-size:28px;font-weight:900;margin-top:14px"></div>
<div class="controls">
<button id="showAnswerBtn" class="primary" onclick="reveal()">SHOW ANSWER</button>
<button id="correctBtn" class="ok hidden" onclick="mark(true)">CORRECT</button>
<button id="wrongBtn" class="bad hidden" onclick="mark(false)">WRONG</button>
<button id="nextBtn" class="primary hidden" onclick="nextTurn()">NEXT TURN</button>
</div>
</section>

<section id="finish" class="card center hidden"><div style="font-size:80px">🏆</div><h2>Game Finished</h2><div id="winner" style="font-size:42px;font-weight:900"></div><div id="finalScores" style="margin:20px"></div><button class="primary" onclick="goHome()">PLAY AGAIN</button></section>

<section id="bank" class="card hidden">
<div class="controls" style="justify-content:space-between"><h2>Question Bank</h2><button class="secondary" onclick="show('home')">Home</button></div>
<div class="settings">
<div class="box"><label>Level</label><select id="bankLevel" onchange="renderBankTopics()"></select></div>
<div class="box"><label>Topic</label><select id="bankTopic" onchange="renderBankList()"></select></div>
</div>
<div id="bankStats" class="small" style="margin:14px 0"></div>
<div id="bankList"></div>
<p class="small">v1.9 uses a clean built-in bank. Every topic has at least 12 questions.</p>
</section>

</div>

function selectTopic(t){topic=t;let arr=BANK[level][topic];if(settings.difficulty!=="all")arr=arr.filter(x=>x.difficulty===settings.difficulty);countInfo.textContent=`${arr.length} questions available`;countGrid.innerHTML="";[6,8,10,12].filter(n=>n<=arr.length).concat(arr.length>12?[arr.length]:[]).filter((v,i,a)=>a.indexOf(v)===i).forEach(n=>{const b=document.createElement("button");b.className="secondary choice";b.textContent=n+" Questions";b.onclick=()=>startGame(n);countGrid.appendChild(b)});show("count")}
function startGame(n){let arr=[...BANK[level][topic]];if(settings.difficulty!=="all")arr=arr.filter(x=>x.difficulty===settings.difficulty);if(settings.order==="random")arr=shuffle(arr);questions=arr.slice(0,n);used=new Set();scores=Array(settings.teams).fill(0);team=0;currentIndex=null;levelBadge.textContent=level;topicBadge.textContent=topic;renderBoard();renderScores();updateTurn();saveState();show("board")}
function renderBoard(){boardGrid.innerHTML="";questions.forEach((q,i)=>{const b=document.createElement("button");b.className="tile"+(used.has(i)?" used":"");b.textContent=i+1;b.disabled=used.has(i);b.onclick=()=>openQuestion(i);boardGrid.appendChild(b)});progress.textContent=`${used.size} of ${questions.length} played`}
function renderScores(){scoreGrid.innerHTML="";for(let i=0;i<settings.teams;i++){const d=document.createElement("div");d.className="team"+(i===team?" active":"");d.innerHTML=`<strong>${settings.teamNames[i]}</strong><div class="score">${scores[i]}</div>`;scoreGrid.appendChild(d)}}
function updateTurn(){const t=settings.teamNames[team].toUpperCase()+"'S TURN";turnBoard.textContent=t;turnQuestion.textContent=t}
function openQuestion(i){currentIndex=i;const q=questions[i];qNum.textContent="Question "+(i+1);diffBadge.textContent=q.difficulty;diffBadge.className="badge diff-"+q.difficulty;const scr=settings.anagram==="saved"?q.scr:scrambleWord(q.a);letters.innerHTML="";scr.split("").forEach(c=>{if(c===" "){const s=document.createElement("div");s.style.width="18px";letters.appendChild(s)}else{const d=document.createElement("div");d.className="letter";d.textContent=c;letters.appendChild(d)}});hint.textContent="Hint: "+q.hint;emoji.textContent=q.e;answer.textContent=q.a.toUpperCase();answerPanel.classList.add("hidden");resultMsg.classList.add("hidden");showAnswerBtn.classList.remove("hidden");correctBtn.classList.add("hidden");wrongBtn.classList.add("hidden");nextBtn.classList.add("hidden");updateTurn();startTimer();show("question");saveState()}
function reveal(){stopTimer();answerPanel.classList.remove("hidden");showAnswerBtn.classList.add("hidden");correctBtn.classList.remove("hidden");wrongBtn.classList.remove("hidden")}
function getPoints(){if(settings.points==="10")return 10;if(settings.points==="20")return 20;return [10,20,30,40,50][Math.floor(Math.random()*5)]}
function mark(ok){used.add(currentIndex);correctBtn.classList.add("hidden");wrongBtn.classList.add("hidden");if(ok){const p=getPoints();scores[team]+=p;resultMsg.textContent="+"+p+" POINTS! 🎉"}else resultMsg.textContent="NO POINTS THIS ROUND";resultMsg.classList.remove("hidden");nextBtn.classList.remove("hidden");renderScores();saveState()}
function nextTurn(){if(used.size===questions.length)return finishGame();team=(team+1)%settings.teams;renderBoard();renderScores();updateTurn();show("board");saveState()}
function finishGame(){const mx=Math.max(...scores);const ws=scores.map((s,i)=>s===mx?settings.teamNames[i]:null).filter(Boolean);winner.textContent=ws.length===1?ws[0]+" WINS!":"TIE: "+ws.join(" & ");finalScores.innerHTML=scores.map((s,i)=>`${settings.teamNames[i]}: <strong>${s}</strong>`).join(" • ");localStorage.removeItem(STORE);show("finish")}
function startTimer(){stopTimer();if(!settings.timer){timerWrap.classList.add("hidden");return}timerWrap.classList.remove("hidden");timeLeft=settings.timer;timer.textContent=timeLeft;timer.classList.remove("danger");timerId=setInterval(()=>{timeLeft--;timer.textContent=timeLeft;if(timeLeft<=5)timer.classList.add("danger");if(timeLeft<=0)stopTimer()},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function saveState(){if(!questions.length)return;localStorage.setItem(STORE,JSON.stringify({settings,level,topic,questions,used:[...used],scores,team,currentIndex}));checkResume()}
function checkResume(){resumePanel.classList.toggle("hidden",!localStorage.getItem(STORE))}
function resumeGame(){try{const s=JSON.parse(localStorage.getItem(STORE));settings=s.settings;level=s.level;topic=s.topic;questions=s.questions;used=new Set(s.used);scores=s.scores;team=s.team;currentIndex=s.currentIndex;levelBadge.textContent=level;topicBadge.textContent=topic;renderBoard();renderScores();updateTurn();show("board")}catch(e){localStorage.removeItem(STORE);checkResume()}}
function goHome(){stopTimer();questions=[];used=new Set();localStorage.removeItem(STORE);checkResume();show("home")}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function openBank(){bankLevel.innerHTML="";Object.keys(BANK).forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=l;bankLevel.appendChild(o)});renderBankTopics();show("bank")}
function renderBankTopics(){bankTopic.innerHTML="";Object.keys(BANK[bankLevel.value]).forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;bankTopic.appendChild(o)});renderBankList()}
function renderBankList(){const arr=BANK[bankLevel.value][bankTopic.value];bankStats.textContent=`${arr.length} questions`;bankList.innerHTML="";arr.forEach((q,i)=>{const d=document.createElement("div");d.className="editorrow";d.innerHTML=`<div><strong>${i+1}. ${q.a}</strong><div class="small">${q.hint}</div></div><span class="badge diff-${q.difficulty}">${q.difficulty}</span>`;bankList.appendChild(d)})}
checkResume();
</script>
</body>
</html>
