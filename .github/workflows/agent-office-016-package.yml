name: Validate Agent Office 0.16.0 package

on:
  push:
    branches:
      - deploy-agent-office-0.16.0
    paths:
      - agent-office-0.16.0/**
      - .github/workflows/agent-office-016-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          cd agent-office-0.16.0
          cat overlay.part.* | tr -d '\n' | base64 -d > overlay.tar.gz
          sha256sum overlay.tar.gz | tee overlay.sha256
          mkdir extracted
          tar -xzf overlay.tar.gz -C extracted
          test "$(node -p "require('./extracted/dist/release.json').version")" = "0.16.0"
          node --check extracted/server/http.mjs
          node --check extracted/server/main.mjs
          node --check extracted/server/skills.mjs
          node --check extracted/dist/campus/agent-skills-entry.js
          node --check extracted/dist/campus/agent-skills.js
          node --check extracted/dist/campus/skill-model.js
          grep -q 'id="tab-skills"' extracted/dist/campus/index.html
          grep -q 'id="view-skills"' extracted/dist/campus/index.html

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifact
          cp agent-office-0.16.0/Dockerfile artifact/
          cp agent-office-0.16.0/docker-compose.yml artifact/
          cp agent-office-0.16.0/overlay.tar.gz artifact/
          sed 's#  overlay.tar.gz#  overlay.tar.gz#' agent-office-0.16.0/overlay.sha256 > artifact/SHA256SUMS

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: kip-agent-office-0.16.0
          path: artifact/
          if-no-files-found: error
          retention-days: 14
